<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شهد — كل الحب</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- خلفية حية -->
    <div class="live-background">
        <div class="stars"></div>
        <div class="clouds"></div>
        <div class="lilac-container" id="lilacContainer"></div>
        <div class="particles" id="particles"></div>
    </div>

    <!-- صفحة البداية -->
    <div class="start-page">
        <div class="moon"></div>
        
        <div class="intro-content">
            <div class="lilac-branch left"></div>
            <div class="lilac-branch right"></div>
            
            <h1 class="main-title">
                <span class="title-line">إلى من ملكت</span>
                <span class="title-line highlight">قلبي كله</span>
            </h1>
            
            <div class="heart-container">
                <div class="heart"></div>
                <div class="heart-glow"></div>
            </div>
            
            <p class="subtitle typewriter" id="typewriterText"></p>
            
            <button class="start-btn" id="startBtn">
                <span class="btn-text">✨ ابدأ رحلتنا</span>
                <div class="btn-glow"></div>
            </button>
            
            <div class="floating-hearts" id="floatingHearts"></div>
        </div>
    </div>

    <!-- تحميل الصوت -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script src="js/main.js"></script>
</body>
</html>
